name: Protected admission shadow

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  observe-authority-changes:
    name: "[shadow] Protected admission"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout pull-request graph as untrusted data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout evaluator from the exact base commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-evaluator
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Observe authority-changing paths without blocking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          python trusted-evaluator/alpha.py protected-admission \
            --project-root target \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --json
          evaluator_status=$?
          echo "Protected-admission evaluator exit code: $evaluator_status"
          if [ "$evaluator_status" -ne 0 ]; then
            echo "Shadow evaluation was incomplete; this workflow remains non-blocking."
          fi
          exit 0
